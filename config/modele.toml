# Modèle de départ du budget (reprise du mois d'octobre d'Excel).
# Utilisé une seule fois par `flask --app budget charger-modele`.
#
# MONTANTS D'EXEMPLE : remplace-les par ceux de ton fichier OCTOBRE_SOLO.xlsx
# avant de charger le modèle (ou corrige-les ensuite dans l'appli, écran « Postes »).
#
# Champs :
#   nom          libellé du poste
#   compte       doit correspondre à un [[comptes]] de settings.toml
#   montant      prévu mensuel en euros
#   categorie    besoins | envies | epargne  (répartition 50-30-20)
#   jour         jour du prélèvement (1-31), optionnel
#   saisonnier   true pour électricité, énergie… (pas de proposition de baisse)
#   contractuel  true pour emprunt, assurances… (jamais de proposition)
#   reserve      true pour le matelas (un seul poste)
#   part_laetitia  part de Laetitia en euros, pour information (facultatif)

# Budget du mois indiqué, financé par le salaire reçu à la fin du mois précédent.
[mois_depart]
annee = 2026
mois = 10
salaire_net = 0
net_imposable = 0
prelevement_source = 0

[[postes]]
nom = "Emprunt immobilier"
compte = "LCL"
montant = 900
categorie = "besoins"
jour = 5
contractuel = true

[[postes]]
nom = "Assurance habitation"
compte = "LCL"
montant = 25
categorie = "besoins"
jour = 10
contractuel = true

