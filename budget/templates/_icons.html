{# Icônes au trait (grille 24, trait 2). Décoratives par défaut : le texte voisin porte le sens. #}
{% macro icon(name, size=20) -%}
<svg class="ico" viewBox="0 0 24 24" width="{{ size }}" height="{{ size }}" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
{%- if name == 'mois' %}<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>
{%- elif name == 'calendrier' %}<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>
{%- elif name == 'analyse' %}<path d="M3 3v18h18"/><path d="M8 17v-5M13 17V8M18 17v-9"/>
{%- elif name == 'cheques' %}<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>
{%- elif name == 'plus-menu' %}<path d="M4 6h16M4 12h16M4 18h16"/>
{%- elif name == 'gauche' %}<path d="m15 18-6-6 6-6"/>
{%- elif name == 'droite' %}<path d="m9 18 6-6-6-6"/>
{%- elif name == 'ajouter' %}<path d="M5 12h14M12 5v14"/>
{%- elif name == 'retirer' %}<path d="M18 6 6 18M6 6l12 12"/>
{%- elif name == 'valider' %}<path d="M20 6 9 17l-5-5"/>
{%- endif %}</svg>
{%- endmacro %}
